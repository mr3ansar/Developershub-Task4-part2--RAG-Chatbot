[project]
name = "rag"
version = "0.2.0"
description = "RAG Chatbot with Streamlit — LangChain 1.x, LCEL, FAISS, Groq"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.8.0",
    "groq>=0.37.0",
    "langchain>=1.3.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.4.0",
    "langchain-groq>=1.1.0",
    "langchain-huggingface>=1.2.0",
    "langchain-text-splitters>=1.1.0",
    "numpy>=2.4.0",
    "PyMuPDF>=1.25.0",
    "python-dotenv>=1.2.0",
    "sentence-transformers>=5.5.0",
    "streamlit>=1.58.0",
    "tiktoken>=0.13.0",
    "torch>=2.12.0",
]
